<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; display: flex; flex-direction: column; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #container { flex: 1; min-height: 42vh; width: 100%; }
    #route-panel {
      flex: 0 1 48vh;
      overflow: auto;
      padding: 12px 16px 20px;
      background: #f7f8fa;
      border-top: 1px solid #e5e7eb;
      font-size: 14px;
      line-height: 1.5;
      color: #1a1a1a;
    }
    #route-panel h2 { margin: 0 0 12px; font-size: 15px; color: #374151; }
    .leg-block {
      margin-bottom: 20px;
      padding: 12px 14px;
      background: #fff;
      border-radius: 10px;
      border: 1px solid #e8eaed;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    .leg-title {
      font-weight: 700;
      font-size: 15px;
      color: #1677ff;
      margin: 0 0 6px;
    }
    .leg-summary { margin: 0 0 10px; font-size: 13px; color: #6b7280; }
    .seg-list { margin: 0; padding-left: 0; list-style: none; counter-reset: step; }
    .seg-list > li {
      counter-increment: step;
      position: relative;
      padding: 10px 0 10px 36px;
      border-bottom: 1px dashed #e5e7eb;
    }
    .seg-list > li:last-child { border-bottom: none; }
    .seg-list > li::before {
      content: counter(step);
      position: absolute;
      left: 0;
      top: 12px;
      width: 24px;
      height: 24px;
      line-height: 24px;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      background: #1677ff;
      border-radius: 50%;
    }
    .mode-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      background: #e8f4ff;
      color: #0958d9;
      font-size: 12px;
      font-weight: 600;
      margin-right: 8px;
      vertical-align: middle;
    }
    .instr { color: #374151; }
    .walk-steps { margin: 8px 0 0 0; padding-left: 1.1em; color: #4b5563; font-size: 13px; }
    .walk-steps li { margin: 4px 0; }
    .line-names { margin-top: 8px; font-size: 13px; color: #111; }
    .stations { margin-top: 6px; font-size: 13px; color: #4b5563; }
    .seg-meta { display: block; margin-top: 6px; font-size: 12px; color: #9ca3af; }
    .hint { font-size: 12px; color: #9ca3af; margin-bottom: 12px; }
    .warn { color: #d97706; font-size: 13px; }
    .loading { color: #6b7280; }
    #map-wrap {
      position: relative;
      flex: 1;
      min-height: 42vh;
      width: 100%;
    }
    #map-legend {
      position: absolute;
      z-index: 120;
      top: 10px;
      right: 10px;
      max-width: min(280px, 92vw);
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.94);
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
      font-size: 12px;
      line-height: 1.45;
      color: #374151;
      pointer-events: auto;
    }
    #map-legend strong { display: block; margin-bottom: 6px; font-size: 13px; color: #111; }
    #map-legend .leg-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 4px 0;
    }
    #map-legend .swatch {
      width: 28px;
      height: 5px;
      border-radius: 2px;
      flex-shrink: 0;
      box-shadow: 0 0 0 1px rgba(0,0,0,.08);
    }
  </style>
</head>
<body>
  <div id="map-wrap">
    <div id="container"></div>
    <div id="map-legend" style="display:none;" aria-label="路线图例"></div>
  </div>
  <div id="route-panel">
    <p class="loading">正在按段请求公交换乘方案…</p>
  </div>
  <script>
    window._AMapSecurityConfig = {
      securityJsCode: 'ac5fd1d36d6174e73665da6d05b355a0',
    };
  </script>
  <script src="https://webapi.amap.com/maps?v=2.0&key=db0d963e8bfea1615a97ff111d0c249e"></script>

  <script>
    const map = new AMap.Map('container', {
      zoom: 13,
      center: [121.47, 31.23],
    });

    /**
     * 途经点（顺序）：相邻两点之间 = 一段公交换乘规划。
     * name 会显示在地图标记与下方说明标题里，可按需修改。
     */
    const itineraryStops = [
      { lng: 121.481028, lat: 31.239643, name: '途经点 1' },
      { lng: 121.47, lat: 31.23, name: '途经点 2' },
      { lng: 121.465302, lat: 31.244717, name: '途经点 3' },
    ];

    const panel = document.getElementById('route-panel');
    const mapLegendEl = document.getElementById('map-legend');

    var routeMarkers = [];
    var routePolylines = [];
    const legColors = ['#1677ff', '#13c2c2', '#722ed1', '#fa8c16', '#52c41a'];

    function escapeHtml(s) {
      if (s == null) return '';
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function stopLngLat(i) {
      var s = itineraryStops[i];
      return new AMap.LngLat(s.lng, s.lat);
    }

    /** 地图上编号圆点：名称在上，圆点在下（锚点落在圆心所在经纬度，更贴路线） */
    function makeStopMarkerContent(index, name, color) {
      var n = index + 1;
      return (
        '<div style="display:flex;flex-direction:column;align-items:center;">' +
        '<div style="margin-bottom:4px;max-width:160px;padding:2px 6px;background:rgba(255,255,255,.96);' +
        'border-radius:4px;font-size:11px;color:#333;box-shadow:0 1px 4px rgba(0,0,0,.15);text-align:center;word-break:break-all;">' +
        escapeHtml(name) +
        '</div>' +
        '<div style="' +
        'width:30px;height:30px;border-radius:50%;background:' +
        color +
        ';color:#fff;font-size:13px;font-weight:800;' +
        'display:flex;align-items:center;justify-content:center;' +
        'border:3px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.35);">' +
        n +
        '</div></div>'
      );
    }

    function renderMapLegend() {
      if (!mapLegendEl || routePolylines.length === 0) return;
      var rows = [];
      for (var i = 0; i < routePolylines.length; i++) {
        var c = legColors[i % legColors.length];
        var fromName = itineraryStops[i] ? itineraryStops[i].name : String(i + 1);
        var toName = itineraryStops[i + 1] ? itineraryStops[i + 1].name : String(i + 2);
        rows.push(
          '<div class="leg-row"><span class="swatch" style="background:' +
            c +
            '"></span><span>第 ' +
            (i + 1) +
            ' 段：' +
            escapeHtml(fromName) +
            ' → ' +
            escapeHtml(toName) +
            '</span></div>'
        );
      }
      mapLegendEl.innerHTML =
        '<strong>路线与颜色</strong><div style="margin-bottom:6px;color:#6b7280;font-size:11px;">圆点数字 = 途经顺序；同色折线 = 该段公交路径</div>' +
        rows.join('');
      mapLegendEl.style.display = 'block';
    }

    function drawStopMarkers(AMap) {
      routeMarkers.forEach(function (m) {
        map.remove(m);
      });
      routeMarkers = [];
      itineraryStops.forEach(function (s, i) {
        var color = i < itineraryStops.length - 1 ? legColors[i % legColors.length] : legColors[(i - 1 + legColors.length) % legColors.length];
        var mk = new AMap.Marker({
          position: [s.lng, s.lat],
          content: makeStopMarkerContent(i, s.name, color),
          anchor: 'bottom-center',
          offset: new AMap.Pixel(0, 0),
          zIndex: 130 + i,
          title: s.name,
        });
        mk.on('click', function () {
          map.setCenter([s.lng, s.lat], true);
          map.setZoom(Math.max(map.getZoom(), 15), true);
        });
        map.add(mk);
        routeMarkers.push(mk);
      });
    }

    function normalizePath(p) {
      if (p == null) return [];
      if (typeof p === 'string') {
        return p.split(';').map(function (s) {
          var a = s.split(',');
          var lng = parseFloat(a[0]);
          var lat = parseFloat(a[1]);
          if (isNaN(lng) || isNaN(lat)) return null;
          return [lng, lat];
        }).filter(Boolean);
      }
      if (!Array.isArray(p)) return [];
      return p.map(function (item) {
        if (!item) return null;
        if (typeof item.lng === 'number' && typeof item.lat === 'number') {
          return [item.lng, item.lat];
        }
        if (typeof item.getLng === 'function' && typeof item.getLat === 'function') {
          return [item.getLng(), item.getLat()];
        }
        if (Array.isArray(item) && item.length >= 2) {
          var lng = Number(item[0]);
          var lat = Number(item[1]);
          if (!isNaN(lng) && !isNaN(lat)) return [lng, lat];
        }
        return null;
      }).filter(Boolean);
    }

    function flattenPlanToPath(plan) {
      var coords = [];
      if (!plan) return coords;

      if (plan.path) {
        var whole = normalizePath(plan.path);
        if (whole.length >= 2) return whole;
      }

      if (!plan.segments || !plan.segments.length) return coords;

      plan.segments.forEach(function (seg) {
        if (seg.walking && seg.walking.path) {
          coords.push.apply(coords, normalizePath(seg.walking.path));
        }

        var t = seg.transit;
        if (!t) return;

        var mode = (seg.transit_mode || '').toUpperCase();

        if (mode === 'WALK') {
          if (t.path) coords.push.apply(coords, normalizePath(t.path));
          if (t.steps && t.steps.length) {
            t.steps.forEach(function (step) {
              if (step.path) coords.push.apply(coords, normalizePath(step.path));
            });
          }
        } else {
          if (t.path) coords.push.apply(coords, normalizePath(t.path));
          if (t.lines && t.lines.length) {
            t.lines.forEach(function (line) {
              if (line.path) coords.push.apply(coords, normalizePath(line.path));
            });
          }
        }
      });

      return coords;
    }

    /** 单段行程文字说明（一步 = 一次换乘动作：步行 / 公交 / 地铁…） */
    function formatSegmentHtml(seg) {
      var mode = (seg.transit_mode || '未知').toUpperCase();
      var t = seg.transit || {};
      var parts = [];

      parts.push('<span class="mode-badge">' + escapeHtml(mode) + '</span>');
      if (seg.instruction) {
        parts.push('<span class="instr">' + escapeHtml(seg.instruction) + '</span>');
      }

      if (mode === 'WALK' && t.steps && t.steps.length) {
        parts.push('<ul class="walk-steps">');
        t.steps.forEach(function (st) {
          var line = escapeHtml(st.instruction || '');
          if (st.distance != null) line += ' <em>(' + Math.round(st.distance) + ' 米)</em>';
          parts.push('<li>' + line + '</li>');
        });
        parts.push('</ul>');
      }

      if (t.lines && t.lines.length) {
        var names = t.lines.map(function (ln) { return ln.name || ''; }).filter(Boolean);
        if (names.length) {
          parts.push('<div class="line-names">线路：<strong>' + escapeHtml(names.join(' → ')) + '</strong></div>');
        }
      }

      if (t.on_station || t.off_station) {
        var onn = (t.on_station && t.on_station.name) || '';
        var offn = (t.off_station && t.off_station.name) || '';
        if (onn || offn) {
          parts.push(
            '<div class="stations">上车站：<strong>' +
              escapeHtml(onn) +
              '</strong>　→　下车站：<strong>' +
              escapeHtml(offn) +
              '</strong></div>'
          );
        }
      }

      var meta = [];
      if (seg.distance != null) meta.push('本段约 ' + Math.round(seg.distance) + ' 米');
      if (seg.time != null) meta.push('约 ' + Math.round(seg.time / 60) + ' 分钟');
      if (meta.length) parts.push('<span class="seg-meta">' + meta.join(' · ') + '</span>');

      return '<div class="seg-body">' + parts.join('') + '</div>';
    }

    /** 一整条「站间」方案：标题 + 方案摘要 + 有序步骤 */
    function appendLegInstructions(legIndex, plan, ok) {
      var loading = panel.querySelector('.loading');
      if (loading) loading.remove();

      if (!panel.querySelector('h2')) {
        panel.insertAdjacentHTML(
          'afterbegin',
          '<h2>分段通行说明</h2>' +
            '<p class="hint">地图右上角有「路线与颜色」图例；数字圆点与途经顺序一致。以下每一段 = 相邻两点之间的公交/地铁/步行，步骤顺序与高德一致。</p>'
        );
      }

      var fromName = itineraryStops[legIndex] ? itineraryStops[legIndex].name : '点' + (legIndex + 1);
      var toName = itineraryStops[legIndex + 1] ? itineraryStops[legIndex + 1].name : '点' + (legIndex + 2);
      var title = '第 ' + (legIndex + 1) + ' 段：' + fromName + ' → ' + toName;

      if (!ok || !plan || !plan.segments || !plan.segments.length) {
        panel.insertAdjacentHTML(
          'beforeend',
          '<div class="leg-block"><h3 class="leg-title">' +
            escapeHtml(title) +
            '</h3><p class="warn">本段未返回有效方案或解析失败，请看控制台 <code>result</code>。</p></div>'
        );
        return;
      }

      var sumParts = [];
      if (plan.time != null) sumParts.push('全程约 <strong>' + Math.round(plan.time / 60) + '</strong> 分钟');
      if (plan.distance != null) sumParts.push('约 <strong>' + Math.round(plan.distance) + '</strong> 米');
      if (plan.cost != null && plan.cost > 0) sumParts.push('票价约 <strong>' + plan.cost + '</strong> 元');
      var summary = sumParts.length ? '<p class="leg-summary">' + sumParts.join('，') + '。</p>' : '';

      var items = plan.segments
        .map(function (seg) {
          return '<li>' + formatSegmentHtml(seg) + '</li>';
        })
        .join('');

      panel.insertAdjacentHTML(
        'beforeend',
        '<div class="leg-block">' +
          '<h3 class="leg-title">' +
          escapeHtml(title) +
          '</h3>' +
          summary +
          '<ol class="seg-list">' +
          items +
          '</ol>' +
          '</div>'
      );
    }

    AMap.plugin(['AMap.Transfer', 'AMap.Polyline', 'AMap.Marker'], function () {
      var transfer = new AMap.Transfer({
        map: null,
        city: '上海',
        hideMarkers: true,
        policy: AMap.TransferPolicy ? AMap.TransferPolicy.LEAST_TIME : 0,
      });

      function runLeg(index) {
        if (index >= itineraryStops.length - 1) {
          drawStopMarkers(AMap);
          renderMapLegend();
          var fit = routePolylines.concat(routeMarkers);
          if (fit.length) {
            map.setFitView(fit, false, [80, 80, 80, 80]);
          }
          var ld = panel.querySelector('.loading');
          if (ld) ld.remove();
          if (!panel.querySelector('.leg-block')) {
            panel.insertAdjacentHTML('beforeend', '<p class="warn">未得到任何路段结果。</p>');
          }
          console.log('多段公交规划完成，折线 ' + routePolylines.length + ' 条，途经点 ' + itineraryStops.length + ' 个');
          return;
        }

        var start = stopLngLat(index);
        var end = stopLngLat(index + 1);

        transfer.search(start, end, function (status, result) {
          console.log('路段 ' + index + ' → ' + (index + 1), status, result);

          var plan = status === 'complete' && result && result.plans && result.plans[0] ? result.plans[0] : null;
          appendLegInstructions(index, plan, !!plan);

          if (plan) {
            var path = flattenPlanToPath(plan);
            if (path.length >= 2) {
              var c = legColors[index % legColors.length];
              var pl = new AMap.Polyline({
                path: path,
                strokeColor: c,
                strokeWeight: 6,
                strokeOpacity: 0.92,
                lineJoin: 'round',
                lineCap: 'round',
                showDir: true,
                zIndex: 50 + index,
                isOutline: true,
                outlineColor: '#ffffff',
                borderWeight: 2,
              });
              map.add(pl);
              routePolylines.push(pl);
            } else {
              console.warn('路段 ' + index + ' 未解析到折线点');
            }
          }

          runLeg(index + 1);
        });
      }

      if (itineraryStops.length < 2) {
        console.error('itineraryStops 至少需要 2 个点');
        panel.innerHTML = '<p class="warn">itineraryStops 至少需要 2 个点</p>';
      } else {
        runLeg(0);
      }
    });
  </script>
</body>
</html>
