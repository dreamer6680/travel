# 数据库、缓存、对象存储、Ollama 等依赖（无 Next / Agent）。
# 由根目录 docker-compose.yml include；也可单独与 app-acr / app-dev 组合。
# Ollama：ollama-init 会在每次 up 时向 ollama 服务拉取 OLLAMA_CHAT_MODEL / OLLAMA_EMBEDDING_MODEL（与 app 环境变量一致即可）。

services:
  ollama:
    image: ollama/ollama:latest
    container_name: travel-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - travel-network

  # 每次 compose up 会执行一次；ollama pull 在已存在模型时很快。需先于 python-agent 完成。
  ollama-init:
    image: ollama/ollama:latest
    container_name: travel-ollama-init
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        export OLLAMA_HOST=http://ollama:11434
        echo "等待 Ollama 就绪并拉取模型: $${OLLAMA_CHAT_MODEL} / $${OLLAMA_EMBEDDING_MODEL}"
        i=0
        while ! ollama list >/dev/null 2>&1; do
          i=$$((i + 1))
          if [ "$$i" -gt 90 ]; then echo "Ollama 未就绪"; exit 1; fi
          sleep 2
        done
        ollama pull "$${OLLAMA_CHAT_MODEL}"
        ollama pull "$${OLLAMA_EMBEDDING_MODEL}"
        echo "Ollama 模型就绪"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:7b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    networks:
      - travel-network

  mongodb:
    image: mongo:7.0
    container_name: travel-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password123}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-trip}
    volumes:
      - mongodb_data:/data/db
    networks:
      - travel-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  postgres:
    image: pgvector/pgvector:pg16
    container_name: travel-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-travel_vectors}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../scripts/init-pg-vector.sql:/docker-entrypoint-initdb.d/init-pg-vector.sql
    networks:
      - travel-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:latest
    container_name: travel-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-12345678}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - travel-network

  redis:
    image: redis:7-alpine
    container_name: travel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - travel-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db-init:
    image: node:20-alpine
    container_name: travel-db-init
    depends_on:
      mongodb:
        condition: service_healthy
    working_dir: /app
    volumes:
      - ..:/app
      - node_modules:/app/node_modules
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-password123}@mongodb:27017/?authSource=admin
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-trip}
      NODE_ENV: development
    command: sh -c "npm install && npm run db:init"
    networks:
      - travel-network
    profiles:
      - init

volumes:
  ollama_data:
    driver: local
  mongodb_data:
    driver: local
  postgres_data:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local
  node_modules:
    driver: local

networks:
  travel-network:
    driver: bridge
