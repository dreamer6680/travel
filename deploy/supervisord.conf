[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:python-agent]
command=/usr/bin/env bash -lc "cd /app/python-agent && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:next]
command=/usr/bin/env bash -lc "cd /app && exec pnpm exec next start -H 0.0.0.0 -p 3000"
directory=/app
autostart=true
autorestart=true
environment=NODE_ENV="production",PYTHON_AGENT_BASE_URL="http://127.0.0.1:8000"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
